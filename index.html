<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPC Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23131826'/%3E%3Cg fill='%2354a0ff'%3E%3Crect x='18' y='18' width='28' height='28' rx='5'/%3E%3Crect x='54' y='18' width='28' height='28' rx='5'/%3E%3Crect x='18' y='54' width='28' height='28' rx='5'/%3E%3Crect x='54' y='54' width='28' height='28' rx='5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- ============================ TOP BAR ============================ -->
    <header id="topbar">
      <div class="brand">
        <span class="logo">◧</span>
        <div class="brand-text">
          <strong>MPC&nbsp;Studio</strong>
          <input id="project-name" class="project-name" value="Untitled Project" title="Project name" />
        </div>
      </div>

      <div class="transport">
        <div class="ctl">
          <label>BPM</label>
          <input id="bpm" type="number" min="20" max="300" value="90" />
        </div>
        <div class="ctl">
          <label>Meter</label>
          <select id="beats-per-bar" title="Beats per bar">
            <option>2</option><option>3</option><option selected>4</option>
            <option>5</option><option>6</option><option>7</option>
          </select>
        </div>
        <div class="ctl">
          <label>Bars</label>
          <select id="bars-per-section" title="Bars per section (loop length)">
            <option>1</option><option selected>2</option><option>4</option><option>8</option>
          </select>
        </div>
        <div class="ctl">
          <label>Quantize</label>
          <select id="quantize">
            <option value="off">Off</option>
            <option value="1/4">1/4</option>
            <option value="1/8">1/8</option>
            <option value="1/8T">1/8T</option>
            <option value="1/16" selected>1/16</option>
            <option value="1/16T">1/16T</option>
            <option value="1/32">1/32</option>
          </select>
        </div>

        <button id="metronome-toggle" class="toggle active" title="Metronome">🎵 Click</button>
        <button id="countin-toggle" class="toggle active" title="One-bar count-in before recording">Count-in</button>

        <div class="transport-buttons">
          <button id="record-btn" class="tbtn record" title="Record a new section (R)">● Rec</button>
          <button id="stop-btn" class="tbtn" title="Stop (Space)">■ Stop</button>
          <button id="play-arrangement-btn" class="tbtn play" title="Play the whole playlist">▶ Play</button>
          <button id="loop-arrangement-btn" class="tbtn" title="Loop the playlist">↻</button>
        </div>

        <div class="ctl master">
          <label>Master</label>
          <input id="master-volume" type="range" min="0" max="1.4" step="0.01" value="0.9" />
        </div>

        <div id="transport-status" class="transport-status">Ready</div>
      </div>
    </header>

    <!-- ============================= MAIN ============================= -->
    <main id="main">
      <!-- LEFT: library + export -->
      <aside id="library-panel" class="panel">
        <section class="lib-section">
          <div class="lib-head">
            <h3>Sound Banks</h3>
            <div class="lib-actions">
              <button id="bank-save" class="mini" title="Save current pads to the loaded bank">Save</button>
              <button id="bank-saveas" class="mini" title="Save as a new bank">Save as…</button>
            </div>
          </div>
          <div class="lib-current">Bank: <span id="current-bank">Untitled Bank</span></div>
          <ul id="banks-list" class="lib-list"></ul>
        </section>

        <section class="lib-section">
          <div class="lib-head">
            <h3>Projects</h3>
            <div class="lib-actions">
              <button id="project-new" class="mini" title="New empty project">New</button>
              <button id="project-save" class="mini" title="Save project">Save</button>
              <button id="project-saveas" class="mini" title="Save as new project">Save as…</button>
            </div>
          </div>
          <ul id="projects-list" class="lib-list"></ul>
        </section>

        <section class="lib-section export">
          <div class="lib-head"><h3>Export for FL Studio</h3></div>
          <label class="checkbox"><input type="checkbox" id="exp-stems" checked /> Per-pad stems</label>
          <label class="checkbox"><input type="checkbox" id="exp-sections" checked /> Per-section WAVs</label>
          <label class="checkbox"><input type="checkbox" id="exp-master" /> Master mix</label>
          <button id="export-btn" class="primary block">⬇ Export ZIP</button>
          <div id="export-progress" class="export-progress"></div>
          <div id="storage-info" class="storage-info"></div>
        </section>
      </aside>

      <!-- CENTER: pads + pad mixer -->
      <section id="center-panel" class="panel">
        <div class="pad-area">
          <div id="pad-grid" class="pad-grid"></div>
          <p class="hint">Drop an audio file on a pad to load it. Play with your keyboard:
            <code>1234 / qwer / asdf / zxcv</code>. Click a pad to edit it below.</p>
        </div>
        <div id="pad-editor" class="pad-editor"></div>
      </section>

      <!-- RIGHT: playlist / arrangement -->
      <aside id="arrangement-panel" class="panel">
        <div class="arr-head">
          <h3>Playlist</h3>
          <span class="arr-hint">Record sections one after another</span>
        </div>
        <div id="playhead-bar" class="playhead-bar"><div id="playhead-fill"></div></div>
        <ul id="sections-list" class="sections-list"></ul>
        <div id="section-editor" class="section-editor"></div>
      </aside>
    </main>
  </div>

  <div id="toast-host"></div>
  <div id="modal-host"></div>

  <!-- load order matters: core -> services -> app -> ui -->
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export-encoders.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/models.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-pads.js"></script>
  <script src="js/ui-mixer.js"></script>
  <script src="js/ui-transport.js"></script>
  <script src="js/ui-arrangement.js"></script>
  <script src="js/ui-library.js"></script>
  <script src="js/ui-main.js"></script>
</body>
</html>
